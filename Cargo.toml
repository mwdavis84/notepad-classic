[package]
name = "notepad-classic"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "A tiny native Win32 text editor"
license = "MIT"

[dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Foundation",
    "Graphics_Printing",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps_Printing",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Printing",
] }
windows-core = { version = "0.62.2", default-features = false }
windows-future = { version = "0.3.2", default-features = false }
windows-numerics = { version = "0.3.1", default-features = false }
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
